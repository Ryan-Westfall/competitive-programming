name: Generate Archive

on:
  push:
    branches:
      - main
    paths:
      - 'leetcode/**'
      - 'data/codeforces.json'
      - 'data/submissions.json'
      - 'scripts/generate_archive.mjs'
  workflow_dispatch:

concurrency:
  group: generate-archive
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate archive files
        run: node scripts/generate_archive.mjs

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain data/) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/problems.json data/tags.json data/stats.json
          git commit -m "chore: regenerate archive data [skip ci]"
          # Pull and rebase to handle concurrent updates
          git pull --rebase origin main || true
          git push origin main
